# Prometheus configuration (plain Prometheus syntax only - no Grafana keys here!).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # API running in Docker Compose (service name "api" on the compose network)
  - job_name: 'fastapi-ml-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          deployment: 'compose'

  # API running in Minikube / Kubernetes. scripts/add_k8s_scrape_target.sh writes
  # monitoring/targets/k8s.json; Prometheus re-reads it every minute, no restart needed.
  - job_name: 'fastapi-ml-app-k8s'
    metrics_path: '/metrics'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 30s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          deployment: 'monitoring'
