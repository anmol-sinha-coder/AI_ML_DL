groups:
  - name: heart-disease-api
    rules:
      - alert: ApiDown
        expr: up{job=~"fastapi-ml-app.*"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "API target {{ $labels.instance }} is down"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status="5xx"}[2m])) / sum(rate(http_requests_total[2m])) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of requests return 5xx"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket[2m]))) > 0.5
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency above 500 ms"

      - alert: ModelNotLoaded
        expr: heart_model_loaded == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Model is not loaded on {{ $labels.instance }}"

      - alert: HighRiskShareAnomaly
        expr: |
          sum(increase(heart_predictions_total{outcome="disease"}[10m]))
            / clamp_min(sum(increase(heart_predictions_total[10m])), 1) > 0.85
        for: 5m
        labels: {severity: info}
        annotations:
          summary: "Unusually high share of 'disease' predictions (possible data drift)"
