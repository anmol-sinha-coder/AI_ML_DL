# Optional: MLflow tracking server inside the cluster (NOT needed by the API).
# Data lives in an emptyDir, so runs are lost when the pod restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.11.1
        command: ["mlflow", "server", "--backend-store-uri", "sqlite:////data/mlflow.db",
                  "--default-artifact-root", "/data/artifacts", "--host", "0.0.0.0", "--port", "5000"]
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
  - port: 5000
    targetPort: 5000
