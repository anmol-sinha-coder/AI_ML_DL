apiVersion: v1
kind: Service
metadata:
  name: heart-disease-service
  labels:
    app: heart-disease-api
spec:
  type: LoadBalancer        # on Minikube: `minikube service heart-disease-service --url` or `minikube tunnel`
  selector:
    app: heart-disease-api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
