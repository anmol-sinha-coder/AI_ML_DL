apiVersion: v1
kind: Service
metadata:
  name: {{ include "heart.fullname" . }}
  labels:
    {{- include "heart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "heart.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
