name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-train:
    name: Lint, Test, and Train ML Pipeline
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest pytest-cov

      - name: Code Linting (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Unit Tests with Coverage
        run: |
          mkdir -p reports
          pytest tests/ --doctest-modules --junitxml=reports/junit.xml --cov=src --cov-report=xml:reports/coverage.xml --cov-report=term

      - name: Data Acquisition & Preprocessing
        run: python -m src.download_data

      - name: Exploratory Data Analysis (EDA)
        run: python -m src.eda

      - name: Train, Tune, and Track Models (MLflow)
        run: python -m src.train

      - name: Publish Metrics to Job Summary
        if: always()
        run: |
          if [ -f reports/metrics.json ]; then
            { echo '### Model Metrics Summary'; echo '```json'; cat reports/metrics.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Build & Model Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          if-no-files-found: warn
          path: |
            models/
            mlruns/
            reports/
            data/heart_disease_clean.csv
            data/eda_plots/

  validate-deploy-configs:
    name: Validate Compose, Prometheus, & Helm Configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
            docker compose config -q
          fi

      - name: Validate Prometheus Config & Alert Rules
        run: |
          if [ -f monitoring/prometheus.yml ]; then
            docker run --rm --entrypoint promtool \
              -v "$PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
              -v "$PWD/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro" \
              prom/prometheus:v2.50.1 check config /etc/prometheus/prometheus.yml
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm Lint and Render Template
        run: |
          if [ -d helm/heart-disease-app ]; then
            helm lint helm/heart-disease-app
            helm template heart-disease-api helm/heart-disease-app > rendered.yaml
            helm template heart-disease-api helm/heart-disease-app --set ingress.enabled=true --set autoscaling.enabled=true > /dev/null
          fi

      - name: Upload Rendered Helm Manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-rendered
          if-no-files-found: ignore
          path: rendered.yaml

  docker-build-test:
    name: Build & Smoke Test Container API
    needs: lint-test-train
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Download Trained Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-artifacts
          path: _artifacts

      - name: Stage Model Artifacts for Container Context
        run: |
          mkdir -p models
          if [ -d _artifacts/models ]; then
            cp -r _artifacts/models/* models/
          fi

      - name: Build Docker Container
        run: docker build -t heart-disease-api:ci .

      - name: Run Container & Test Endpoint (/predict)
        run: |
          docker run -d -p 8000:8000 --name ml_api heart-disease-api:ci
          sleep 5
          
          if [ -f scripts/smoke_test.sh ]; then
            chmod +x scripts/smoke_test.sh
            scripts/smoke_test.sh http://localhost:8000 | tee smoke_test.log
          else
            echo "Executing direct API health check and POST prediction..."
            curl -f -X POST "http://localhost:8000/predict" \
                 -H "Content-Type: application/json" \
                 -d '{"age": 55, "sex": 1, "cp": 0, "trestbps": 130, "chol": 250, "fbs": 0, "restecg": 1, "thalach": 140, "exang": 0, "oldpeak": 1.5, "slope": 2, "ca": 0, "thal": 2}' | tee smoke_test.log
          fi

      - name: Collect Container Logs
        if: always()
        run: docker logs ml_api > container.log 2>&1 || true

      - name: Upload Container Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          if-no-files-found: ignore
          path: |
            smoke_test.log
            container.log