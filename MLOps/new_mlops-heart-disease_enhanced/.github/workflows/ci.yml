name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-train:
    name: Lint, test and train
    runs-on: ubuntu-latest
    env:
      # file-based MLflow store: no tracking server needed in CI
      MLFLOW_TRACKING_URI: file:./mlruns
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (fails the build on any flake8 error)
        run: flake8 . --count --show-source --statistics

      - name: Unit tests with coverage
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov=src --cov-report=xml:reports/coverage.xml --cov-report=term

      - name: Download dataset and build cleaned CSV
        run: python -m src.download_data

      - name: EDA plots
        run: python -m src.eda

      - name: Train, tune and track models
        run: python -m src.train

      - name: Publish metrics to job summary
        if: always()
        run: |
          if [ -f reports/metrics.json ]; then
            { echo '### Model metrics'; echo '```json'; cat reports/metrics.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          if-no-files-found: warn
          path: |
            models/
            mlruns/
            reports/
            data/heart_disease_clean.csv
            data/eda_plots/

  validate-deploy-configs:
    name: Validate Compose, Prometheus, Grafana and Helm configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Compose file
        run: docker compose config -q

      - name: Prometheus config and alert rules (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro" \
            prom/prometheus:v2.50.1 check config /etc/prometheus/prometheus.yml

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint and template
        run: |
          helm lint helm/heart-disease-app
          helm template heart-disease-api helm/heart-disease-app > rendered.yaml
          helm template heart-disease-api helm/heart-disease-app --set ingress.enabled=true --set autoscaling.enabled=true > /dev/null

      - name: Upload rendered Helm manifests
        uses: actions/upload-artifact@v4
        with:
          name: helm-rendered
          path: rendered.yaml

  docker-build-test:
    name: Build and test the Docker image
    runs-on: ubuntu-latest
    needs: lint-test-train
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: ml-artifacts
          path: _artifacts

      - name: Place model next to the Dockerfile
        run: |
          mkdir -p models
          cp _artifacts/models/* models/

      - name: Build image
        run: docker build -t heart-disease-api:ci .

      - name: Run container and smoke-test /predict
        run: |
          docker run -d --name api -p 8000:8000 heart-disease-api:ci
          scripts/smoke_test.sh http://localhost:8000 | tee smoke_test.log

      - name: Collect container logs
        if: always()
        run: docker logs api > container.log 2>&1 || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            smoke_test.log
            container.log
