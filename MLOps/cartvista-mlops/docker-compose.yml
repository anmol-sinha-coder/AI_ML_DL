version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cartvista-prometheus
    network_mode: "host"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cartvista-grafana
    network_mode: "host"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=cartvista